name: Deploy to GitHub Pages
# Builds and publishes the app on every push to the default branch.
# Needs: Settings → Pages → Source = "GitHub Actions", and repository
# *variables* VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY (publishable key).
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # Guardrail: nothing is published unless the safety checks pass first.
  verify:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migration guardrail
        env:
          BASE_SHA: ${{ github.event.before }}
        run: node scripts/check-migrations.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Database tests (RLS, attacks, recovery, contract)
        run: |
          ls /usr/lib/postgresql/*/bin/initdb || (sudo apt-get update && sudo apt-get install -y postgresql)
          ./supabase/tests/run.sh
  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check config
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          case "$VITE_SUPABASE_ANON_KEY" in sb_secret_*|*service_role*)
            echo "::error::That is a SECRET key. Use the publishable (sb_publishable_…) key instead."; exit 1;;
          esac
          # Legacy keys are JWTs; refuse one whose payload says service_role.
          if echo "$VITE_SUPABASE_ANON_KEY" | cut -d. -f2 | base64 -d 2>/dev/null | grep -q service_role; then
            echo "::error::That is the service_role key. Use the publishable/anon key instead."; exit 1
          fi
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Add repository variables VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_BUILD_ID: ${{ github.sha }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
